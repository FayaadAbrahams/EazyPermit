<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eazy Permit - Zoning Assistant</title>
    <link rel="icon" type="image/x-icon"
      href="/assets/img/cct-logo-small.svg">
    <link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600&display=swap');

        :root {
            --primary-clr: #ffab1f;
            --secondary-clr: #00a7cf;
            --background-clr: #ffffff;
            --black: #333;
            --light-color: #666;
            --light-bg: #f5f5f5;
            --chatbot-bg: #6d6d7a;
            --user-message: #007bff;
            --bot-message: #e9ecef;
            --border: 1px solid #ddd;
            --box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            --accent-color: #d60076;
        }

        * {
            font-family: 'Rubik', sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            outline: none;
            border: none;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        html {
            font-size: 62.5%;
            overflow-x: hidden;
        }

        body {
            background: linear-gradient(135deg, var(--accent-color) 0%, #b8005a 100%);
            min-height: 100vh;
            color: var(--black);
            font-size: 1.6rem;
        }

        /* Header Styles */
        .header {
            background-color: var(--background-clr);
            box-shadow: var(--box-shadow);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header-1 {
            background-color: var(--secondary-clr);
            padding: 1.5rem 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .header-1 .flex {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .header-1 img {
            width: 3rem;
            height: 3rem;
            filter: brightness(0) saturate(100%) invert(100%);
        }

        .header-1 p {
            font-size: 1.8rem;
            color: var(--background-clr);
            margin: 0;
        }

        .header-1 a {
            color: var(--background-clr) !important;
            text-decoration: none;
            font-weight: 500;
        }

        .header-1 a:hover {
            color: var(--primary-clr) !important;
        }

        .header-2 {
            padding: 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 1200px;
            margin: 0 auto;
        }

        .header-2 .logo img {
            width: 200px;
            height: auto;
        }

        .navbar {
            display: flex;
            gap: 3rem;
        }

        .navbar a {
            font-size: 1.8rem;
            color: var(--light-color);
            font-weight: 500;
            padding: 1rem 0;
            position: relative;
        }

        .navbar a:hover {
            color: var(--secondary-clr);
        }

        .navbar a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background-color: var(--secondary-clr);
            transition: width 0.3s ease;
        }

        .navbar a:hover::after {
            width: 100%;
        }

        /* Dashboard Header */
        .dashboard-header {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--background-clr);
        }

        .dashboard-header h1 {
            font-size: 4rem;
            font-weight: 600;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
            margin-bottom: 1rem;
        }

        /* Main Section */
        section {
            max-width: 900px;
            margin: 2rem auto;
            padding: 0 2rem;
        }

        #chatbot {
            background-color: var(--chatbot-bg);
            border-radius: 15px;
            box-shadow: var(--box-shadow);
            padding: 3rem;
            display: flex;
            flex-direction: column;
            gap: 2rem;
            min-height: 500px;
        }

        #chatbox {
            background-color: var(--light-bg);
            border: var(--border);
            border-radius: 12px;
            padding: 2rem;
            height: 400px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            scroll-behavior: smooth;
        }

        #chatbox::-webkit-scrollbar {
            width: 8px;
        }

        #chatbox::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }

        #chatbox::-webkit-scrollbar-thumb {
            background: var(--secondary-clr);
            border-radius: 4px;
        }

        .message {
            padding: 1.5rem 2rem;
            border-radius: 20px;
            max-width: 85%;
            line-height: 1.6;
            word-wrap: break-word;
            font-size: 1.6rem;
            animation: fadeInMessage 0.3s ease-out;
        }

        @keyframes fadeInMessage {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.bot {
            background-color: var(--bot-message);
            color: var(--black);
            align-self: flex-start;
            border: 1px solid #ddd;
        }

        .message.user {
            background-color: var(--user-message);
            color: white;
            align-self: flex-end;
            box-shadow: 0 2px 8px rgba(0, 123, 255, 0.3);
        }

        .message a {
            color: var(--secondary-clr);
            text-decoration: underline;
            font-weight: 500;
        }

        .message a:hover {
            color: var(--primary-clr);
        }

        .message strong {
            font-weight: 600;
            color: var(--secondary-clr);
        }

        #userInput {
            padding: 1.5rem 2rem;
            border: 2px solid #ccc;
            border-radius: 25px;
            font-size: 1.6rem;
            width: 100%;
            background-color: var(--background-clr);
            transition: all 0.3s ease;
        }

        #userInput:focus {
            border-color: var(--secondary-clr);
            box-shadow: 0 0 0 3px rgba(0, 167, 207, 0.1);
        }

        #userInput::placeholder {
            color: var(--light-color);
            opacity: 0.8;
        }

        /* Footer */
        footer {
            background-color: #2e3235;
            color: var(--background-clr);
            text-align: center;
            padding: 3rem 2rem;
            margin-top: 26rem;
        }

        footer span {
            font-size: 1.6rem;
            opacity: 0.9;
        }

        /* Mobile Menu Button */
        #menu-btn {
            display: none;
            font-size: 2.5rem;
            color: var(--black);
            cursor: pointer;
        }

        /* Responsive Design */
        @media (max-width: 991px) {
            html {
                font-size: 55%;
            }
            
            .header-2 {
                padding: 1.5rem;
            }
            
            .navbar {
                gap: 2rem;
            }

            .dashboard-header h1 {
                font-size: 3.2rem;
            }
        }

        @media (max-width: 768px) {
            #menu-btn {
                display: inline-block;
            }

            .navbar {
                position: absolute;
                top: 100%;
                left: 0;
                right: 0;
                background-color: var(--background-clr);
                flex-direction: column;
                gap: 0;
                clip-path: polygon(0 0, 100% 0, 100% 0, 0 0);
                transition: all 0.3s ease;
                border-top: var(--border);
                box-shadow: var(--box-shadow);
            }

            .navbar.active {
                clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
            }

            .navbar a {
                display: block;
                font-size: 2rem;
                padding: 2rem;
                border-bottom: 1px solid #eee;
            }

            .navbar a:last-child {
                border-bottom: none;
            }

            .dashboard-header h1 {
                font-size: 2.8rem;
            }

            #chatbot {
                padding: 2rem;
                margin: 1rem;
            }

            #chatbox {
                height: 350px;
                padding: 1.5rem;
            }

            .message {
                max-width: 95%;
                padding: 1.2rem 1.8rem;
                font-size: 1.5rem;
            }
        }

        @media (max-width: 450px) {
            html {
                font-size: 50%;
            }

            .dashboard-header {
                padding: 3rem 1rem;
            }

            .dashboard-header h1 {
                font-size: 2.4rem;
            }

            #chatbot {
                padding: 1.5rem;
            }

            #chatbox {
                height: 300px;
            }
        }

        /* Loading animation */
        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 1rem;
            background-color: var(--bot-message);
            border-radius: 20px;
            max-width: 80px;
            align-self: flex-start;
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--light-color);
            animation: typing 1.4s infinite ease-in-out;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
                opacity: 0.4;
            }
            30% {
                transform: translateY(-10px);
                opacity: 1;
            }
        }
    </style>
  </head>

  <body>
    <header class="header">
      <div class="header-1">
        <div class="flex">
          <img src="../assets/img/profile.svg" alt="Profile">
          <p>
            <a href="#">John Dory</a>
          </p>
        </div>
      </div>

      <div class="header-2">
        <a href="landing-page.html" class="logo">
          <img src="../assets/img/cct-logo.svg" alt="CCT Logo">
        </a>

        <nav class="navbar">
          <a href="../pages/dashboard.html">Dashboard</a>
          <a href="../pages/ZoningPage.html">Zoning Info</a>
          <a href="../pages/contact page.html">Contact us</a>
          <a href="../pages/Checkout.html">Pay Bills</a>
        </nav>

        <div id="menu-btn" class="fas fa-bars"></div>
      </div>
    </header>

    <div class="dashboard-header">
      <h1>Identify and Understand Your Zoning Property</h1>
    </div>

    <section>
      <div id="chatbot">
        <div id="chatbox"></div>
        <input
          id="userInput"
          placeholder="Type your message here..."
          autocomplete="off"
          autofocus>
      </div>
    </section>

    <footer>
      <span>Copyright 2025 City of Cape Town. All rights reserved.</span>
    </footer>

    <script>
        const zoningTypes = {
            "Single Residential": {
                short: "Low-to-medium density homes with limited home employment allowed.",
                details: `
                🏡 <strong>Single Residential</strong><br><br>
                • Primarily single-family homes in low-to-medium density areas<br>
                • Allows limited home employment, additional dwellings, and low-intensity mixed-use<br>
                • Provides a safe, pleasant residential environment<br>
                `
            },
            "General Residential": {
                short: "Higher-density urban living with limited mixed-use.",
                details: `
                🏢 <strong>General Residential</strong><br><br>
                • Supports medium to high-density living (e.g., flats, townhouses)<br>
                • Encourages urban growth and avoids sprawl<br>
                • Allows some mixed-use and home-based businesses with restrictions<br>
                • Development intensity varies by sub-zoning<br>
                `
            },
            "Community": {
                short: "Zoning for educational, religious, welfare, and health services.",
                details: `
                🏥 <strong>Community (CO1 & CO2)</strong><br><br>
                • For schools, churches, clinics, and community centers<br>
                • CO1 serves local community needs<br>
                • CO2 serves wider regional needs and may allow larger buildings<br>
                • Encourages attractive, focal buildings<br>
                `
            },
            "Local Business": {
                short: "Shops and offices in neighbourhood areas with controlled retail.",
                details: `
                🏪 <strong>Local Business</strong><br><br>
                • For neighbourhood shops, offices, and low-impact retail<br>
                • Provides buffer between busy business districts and homes<br>
                • Larger or high-impact retail is restricted or needs consent<br>
                `
            },
            "General Business and Mixed-use": {
                short: "Broad economic development with residential, business and some industrial.",
                details: `
                🏬 <strong>General Business & Mixed-use</strong><br><br>
                • Mixes residential, business, and some light industrial uses<br>
                • Common in development corridors and town centers<br>
                • Requires careful planning to minimize residential-industrial conflicts<br>
                `
            },
            "Industrial": {
                short: "For manufacturing, including general and hazardous industry.",
                details: `
                🏭 <strong>Industrial</strong><br><br>
                • For factories, warehouses, and heavy-duty production<br>
                • Includes general and hazardous industries<br>
                • Requires good infrastructure (roads, waste)<br>
                • Should be separate from residential areas<br>
                `
            },
            "Utility, Transport, National Port": {
                short: "Used for public transport, utilities, and national port activities.",
                details: `
                🚉 <strong>Utility, Transport & National Port</strong><br><br>
                • For public services like power stations, roads, railways, and harbours<br>
                • Zoning based on function, not ownership<br>
                • May allow mixed-use if it doesn't interfere with operations<br>
                • Port zones governed by the National Ports Act<br>
                `
            },
            "Open Space": {
                short: "Includes parks, nature reserves, and recreation areas.",
                details: `
                🌳 <strong>Open Space</strong><br><br>
                • Parks, sports fields, nature reserves, and recreational areas<br>
                • Important for community wellbeing and biodiversity protection<br>
                `
            },
            "Agricultural, Rural and Limited Use": {
                short: "For farming and rural preservation; limits urban encroachment.",
                details: `
                🌾 <strong>Agricultural, Rural & Limited Use</strong><br><br>
                • Protects farming land and rural lifestyle<br>
                • AG = large farms, RU = smallholdings, LU = undetermined land<br>
                • Permits activities supporting agriculture<br>
                `
            }
        };

        const chatbox = document.getElementById("chatbox");
        const input = document.getElementById("userInput");
        let step = 0;
        let userZoning = null;
        let businessType = null;

        function getZoningList() {
            return Object.keys(zoningTypes)
                .map((key, i) => `${i + 1}. <strong>${key}</strong> — ${zoningTypes[key].short}`)
                .join("<br>");
        }

        function parseZoningInput(input) {
            const names = Object.keys(zoningTypes);
            const num = parseInt(input);
            if (!isNaN(num) && num >= 1 && num <= names.length) {
                return names[num - 1];
            }
            return names.find(name => name.toLowerCase() === input.toLowerCase()) || null;
        }

        function checkForMusicQuery(text) {
            const keywords = ["music", "noise", "sound", "amplified", "loud", "mobile food truck", "hawker", "playing music"];
            return keywords.some(k => text.includes(k));
        }

        function addTypingIndicator() {
            const indicator = document.createElement("div");
            indicator.classList.add("typing-indicator");
            indicator.innerHTML = "<span></span><span></span><span></span>";
            chatbox.appendChild(indicator);
            chatbox.scrollTop = chatbox.scrollHeight;
            return indicator;
        }

        function addMessage(text, sender = "bot") {
            const div = document.createElement("div");
            div.classList.add("message", sender);
            div.innerHTML = text;
            chatbox.appendChild(div);
            chatbox.scrollTop = chatbox.scrollHeight;
        }

        function addMessageWithDelay(text, sender = "bot", delay = 800) {
            const indicator = addTypingIndicator();
            setTimeout(() => {
                indicator.remove();
                addMessage(text, sender);
            }, delay);
        }

        function startChat() {
            addMessage("Hi there! 👋 Welcome to the Cape Town Zoning Assistant.");
            setTimeout(() => {
                addMessage("Do you know your property's zoning type? (Type 'yes' or 'no')");
                step = 1;
            }, 1000);
        }

        function handleStep(inputText) {
            const text = inputText.trim().toLowerCase();

            if (step === 1) {
                if (text === "yes") {
                    addMessageWithDelay("Great! You can type the zoning type name or select a number from the list.<br><br>Type 'list' to see all available zoning types.");
                    step = 2;
                } else if (text === "no") {
                    addMessageWithDelay("No problem! You can view the official Cape Town zoning map here:<br><br><a href='https://citymaps.capetown.gov.za/EGISViewer/' target='_blank'>🗺️ View Zoning Map</a>");
                    setTimeout(() => {
                        addMessage("Once you know your zoning, type it here or type 'list' to see all zoning types.");
                        step = 2;
                    }, 1500);
                } else {
                    addMessageWithDelay("Please reply with 'yes' or 'no' 😊", "bot", 500);
                }
            } else if (step === 2) {
                if (text === "list") {
                    addMessageWithDelay("Here are all the zoning types available in Cape Town:<br><br>" + getZoningList() + "<br><br>Type the number or name of your zoning type.");
                } else {
                    const zoningName = parseZoningInput(text);
                    if (zoningName) {
                        userZoning = zoningName;
                        addMessageWithDelay(zoningTypes[zoningName].details);
                        setTimeout(() => {
                            addMessage("What type of business are you planning to operate?<br><br>Examples: food truck, spa, retail shop, nightclub, office, etc.");
                            step = 3;
                        }, 2000);
                    } else {
                        addMessageWithDelay("I didn't recognize that zoning type. Please try typing 'list' to see all options, or enter a valid zoning name.", "bot", 500);
                    }
                }
            } else if (step === 3) {
                businessType = text;

                if (checkForMusicQuery(text) || text.includes("mobile") || text.includes("music")) {
                    let message = `🎵 <strong>Music & Noise Regulations</strong><br><br>`;

                    if (userZoning === "Community") {
                        message += `🔇 In a <strong>Community Zone</strong>:<br>
                        • Loud or amplified music is generally not permitted<br>
                        • You may need special consent or noise exemption<br>
                        • Community facilities must respect noise bylaws<br><br>`;
                    } else {
                        message += `📌 Music regulations depend on your specific zone and local noise bylaws.<br>
                        • Some zones allow music with proper permits<br>
                        • Residential areas have stricter noise restrictions<br><br>`;
                    }

                    if (text.includes("food truck") || text.includes("mobile")) {
                        message += `🚚 <strong>Mobile Food Business</strong>:<br>
                        • Must comply with City's <a href="https://www.capetown.gov.za/City-Connect/Apply/Planning-building-and-development/Land-use-applications/Noise-control" target="_blank">Noise Control Bylaw</a><br>
                        • Music/sound equipment often restricted in residential zones<br>
                        • May need permits for any amplified sound<br>
                        • Consider operating hours and location restrictions<br><br>`;
                    }

                    message += `📞 <strong>Next Steps</strong>:<br>
                    • Contact City Planning Department for specific guidance<br>
                    • Apply for necessary permits and licenses<br>
                    • Check with local ward councillor for area-specific rules`;

                    addMessageWithDelay(message, "bot", 1200);
                } else {
                    addMessageWithDelay(`✅ <strong>Thank you for the information!</strong><br><br>
                    Based on your <strong>${userZoning}</strong> zoning and <strong>${businessType}</strong> business type:<br><br>
                    
                    📋 <strong>Recommended Next Steps</strong>:<br>
                    • Contact the City of Cape Town Planning Department<br>
                    • Check if your business requires special consent<br>
                    • Apply for necessary business licenses<br>
                    • Verify compliance with building and health regulations<br><br>
                    
                    📞 <strong>Contact Information</strong>:<br>
                    • Planning Department: 021 400 6840<br>
                    • Business Licensing: 021 400 4000<br><br>
                    
                    🌐 <strong>Useful Links</strong>:<br>
                    • <a href="https://www.capetown.gov.za/Work%20and%20business/Apply-for-licences" target="_blank">Business License Applications</a><br>
                    • <a href="https://www.capetown.gov.za/City-Connect/Apply/Planning-building-and-development" target="_blank">Planning Applications</a>`, "bot", 1200);
                }

                setTimeout(() => {
                    addMessage("Is there anything else you'd like to know about zoning or business regulations? Feel free to start a new conversation!", "bot");
                }, 3000);
            }
        }

        // Mobile menu functionality
        document.getElementById('menu-btn').addEventListener('click', function() {
            const navbar = document.querySelector('.navbar');
            navbar.classList.toggle('active');
        });

        // Close mobile menu when clicking on a link
        document.querySelectorAll('.navbar a').forEach(link => {
            link.addEventListener('click', () => {
                document.querySelector('.navbar').classList.remove('active');
            });
        });

        // Chat functionality
        input.addEventListener("keydown", (e) => {
            if (e.key === "Enter" && input.value.trim() !== "") {
                const userText = input.value.trim();
                addMessage(userText, "user");
                input.value = "";
                setTimeout(() => handleStep(userText), 300);
            }
        });

        // Initialize chat
        startChat();
    </script>
  </body>
</html>
